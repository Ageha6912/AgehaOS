<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记忆翻牌</title>
    <link rel="stylesheet" href="./memory.css" />
  </head>
  <body>
    <header>
      <h1>记忆翻牌</h1>
