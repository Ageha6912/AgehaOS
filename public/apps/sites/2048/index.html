<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2048</title>
    <link rel="stylesheet" href="./merge.css" />
  </head>
  <body>
    <header>
      <h1>2048</h1>
      <span class="mono">得分 <b id="score">0</b></span>
    </header>
    <div id="grid" class="grid" aria-label="2048 棋盘"></div>
    <div class="pad" aria-label="方向控制">
      <button data-dir="up" type="button" aria-label="上">↑</button>
      <button data-dir="left" type="button" aria-label="左">←</button>
      <button data-dir="down" type="button" aria-label="下">↓</button>
      <button data-dir="right" type="button" aria-label="右">→</button>
    </div>
    <div class="bar">
      <button id="new" type="button" class="primary">新游戏</button>
    </div>
    <p class="hint">方向键合并相同数字 · 拼出 2048</p>
    <script src="./merge.js"></script>
  </body>
</html>
