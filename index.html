<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover（M0-4 Safe Area）：页面延伸进刘海/Home indicator
         区域，env(safe-area-inset-*) 才会有非零值供 .mobile-shell 的
         --safe-* 消费；无挖孔设备 env 恒 0，占位带落 max() 保底高度。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="AgehaOS — Your Web OS, Your Space." />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/agehaos-logo-v2-mark-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/agehaos-logo-v2-mark-192.png" />
    <link rel="apple-touch-icon" href="/brand/agehaos-logo-v2-mark-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- PWA standalone（M0-5）：iOS 无 manifest display 支持，靠这两个 meta
         进入独立窗口与全屏状态栏（black-translucent 配合 M0-4 的
         safe-area 占位带——内容延伸进状态栏底下，由 --safe-top 顶开）。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2f5fe8" />
    <title>AgehaOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
