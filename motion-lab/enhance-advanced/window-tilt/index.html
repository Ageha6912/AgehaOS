<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>效果 3 · 窗口切换转场 — AgehaOS 动效实验室</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="window-tilt.css">
</head>
<body>
  <main class="ml-stage" aria-label="窗口切换转场演示舞台">
    <!-- 效果 3 根元素：独立演示页默认启用 -->
    <div class="mtw-field" data-ml-windows data-ml-enabled="true">
      <section class="mtw is-focused" tabindex="0" aria-label="演示窗口：季度报告文稿">
        <span class="mtw__shadow" aria-hidden="true"></span>
        <header class="mtw__titlebar">
          <span class="mtw__dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="mtw__title">季度报告 · 文稿</span>
        </header>
        <div class="mtw__body">
          <div class="mtw__line" style="width: 82%"></div>
          <div class="mtw__line" style="width: 64%"></div>
          <div class="mtw__line" style="width: 74%"></div>
          <div class="mtw__line mtw__line--accent" style="width: 38%"></div>
        </div>
      </section>

      <section class="mtw" tabindex="0" aria-label="演示窗口：系统图表">
        <span class="mtw__shadow" aria-hidden="true"></span>
        <header class="mtw__titlebar">
          <span class="mtw__dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="mtw__title">系统图表 · 监视</span>
        </header>
        <div class="mtw__body">
          <div class="mtw__bars" aria-hidden="true">
            <span class="mtw__bar" style="height: 42%"></span>
            <span class="mtw__bar" style="height: 68%"></span>
            <span class="mtw__bar mtw__bar--accent" style="height: 88%"></span>
            <span class="mtw__bar" style="height: 55%"></span>
            <span class="mtw__bar" style="height: 74%"></span>
          </div>
        </div>
      </section>
    </div>

    <aside class="mlc-panel mlc-panel--mini" role="group" aria-label="演示控制">
      <h2 class="mlc-panel__title">效果 3 · 窗口切换转场</h2>
      <button class="mlc-btn" data-ml-theme-btn type="button">☾ 切换深色主题</button>
      <p class="mlc-note">点击窗口或用 Tab 键切换焦点：crossfade + ≤2deg 3D tilt，失焦窗口轻微退后。</p>
      <p class="mlc-note" data-ml-reduced-note hidden>已检测到 prefers-reduced-motion：位移与倾斜已归零，仅保留 120ms 透明度交叉淡化。</p>
      <a class="mlc-back" href="../index.html">← 返回组合演示页</a>
    </aside>
  </main>

  <script src="window-tilt.js"></script>
  <script src="../script.js"></script>
</body>
</html>
